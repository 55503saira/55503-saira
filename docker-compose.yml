services:
  web:
    build: .
    ports:
      - "8003:5000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - mynet

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    networks:
      - mynet

networks:
  mynet:

volumes:
  redis-data: